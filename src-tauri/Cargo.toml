[package]
name = "whoami"
version = "0.1.0"
description = "Who Am I — a private, locally-owned life & career record"
authors = ["Jelani John"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "whoami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` backs the transparent window (macOSPrivateApi in
# tauri.conf.json) so the rounded app panel is the visible window shape;
# inert on Linux/Windows, where transparency needs no extra feature.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keyring for provider secrets (the Secrets seam). crypto-rust keeps the
# Linux secret-service backend pure-Rust — no system OpenSSL needed to build.
keyring = { version = "3.6", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
# Gmail OAuth (desktop loopback + PKCE) is hand-rolled in gmail_oauth.rs — no
# OAuth SDK, same as waid. Minimal, ubiquitous primitives: a localhost listener
# for the redirect (tokio::net), SHA-256 + base64url for the PKCE challenge, OS
# entropy for the verifier/state, reqwest for the token exchange, and the opener
# plugin to launch the system browser for consent.
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "time", "io-util"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["clock"], default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
