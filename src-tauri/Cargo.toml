[package]
name = "whoami"
version = "0.1.0"
description = "Who Am I — a private, locally-owned life & career record"
authors = ["Jelani John"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "whoami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
